name: Full Stack CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      
  workflow_dispatch:

jobs:

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./backend/chatme/BayTack.sln

      - name: Build
        run: dotnet build ./backend/chatme/BayTack.sln --no-restore

      - name: Test
        run: dotnet test ./backend/chatme/BayTack.sln --no-build


  frontend:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Angular
        run: npm run build
        working-directory: ./frontend
