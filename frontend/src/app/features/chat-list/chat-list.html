<div class="flex flex-col h-full bg-white dark:bg-wa-dark-panel">
  @switch (sidebarView()) {
    @case ('profile') {
      <app-profile-panel />
    }
    @case ('settings') {
      <app-settings-panel />
    }
    @case ('newChat') {
      <app-new-chat />
    }
    @case ('newGroup') {
      <app-new-group />
    }
    @default {
      <!-- Header -->
      <div class="flex items-center justify-between px-4 py-3 bg-wa-bg-panel dark:bg-wa-dark-panel border-b border-gray-200 dark:border-wa-dark-border">
        <div class="flex items-center gap-3">
          <!-- صورة المستخدم الحالي: بتفتح صفحة البروفايل -->
          <button (click)="onOpenProfile()" aria-label="فتح البروفايل الشخصي">
            <app-avatar [src]="currentUser().avatarUrl" [size]="38" />
          </button>
          <h1 class="text-xl font-semibold text-gray-800 dark:text-gray-100">المحادثات</h1>
        </div>

        <div class="flex items-center gap-1">
          <!-- زرار تبديل الوضع الليلي -->
          <button
            (click)="onToggleTheme()"
            class="text-wa-gray-icon dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-white/10 p-2 rounded-full transition-colors"
            [attr.aria-label]="isDarkMode() ? 'تفعيل الوضع العادي' : 'تفعيل الوضع الليلي'"
          >
            @if (isDarkMode()) {
              <!-- أيقونة شمس -->
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-linecap="round"/>
              </svg>
            } @else {
              <!-- أيقونة قمر -->
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.1 22c5.5 0 9.9-4.4 9.9-9.9 0-.5-.4-.8-.9-.7-1 .3-2 .4-3.1.4-6 0-10.9-4.9-10.9-10.9 0-1 .1-2.1.4-3.1.1-.5-.2-.9-.7-.9C1.4 2.9 2 7.3 2 12.1 2 17.6 6.5 22 12.1 22z"/>
              </svg>
            }
          </button>

          <!-- زرار محادثة جديدة -->
          <button
            (click)="onOpenNewChat()"
            class="text-wa-gray-icon dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-white/10 p-2 rounded-full transition-colors"
            aria-label="محادثة جديدة"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
          </button>

          <!-- زرار الإعدادات -->
          <button
            (click)="onOpenSettings()"
            class="text-wa-gray-icon dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-white/10 p-2 rounded-full transition-colors"
            aria-label="الإعدادات"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 8a2 2 0 100-4 2 2 0 000 4zM12 14a2 2 0 100-4 2 2 0 000 4zM12 20a2 2 0 100-4 2 2 0 000 4z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="px-3 py-2 bg-white dark:bg-wa-dark-panel border-b border-gray-100 dark:border-wa-dark-border">
        <div class="flex items-center gap-2 bg-wa-bg-panel dark:bg-wa-dark-bg rounded-lg px-3 py-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-wa-gray-icon dark:text-gray-400 shrink-0">
            <circle cx="11" cy="11" r="8" stroke-width="2"/>
            <path d="M21 21l-4.35-4.35" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            #searchInput
            type="text"
            (input)="onSearchChange(searchInput.value)"
            placeholder="بحث أو بدء محادثة جديدة"
            class="bg-transparent outline-none text-sm w-full text-gray-700 dark:text-gray-200 placeholder:text-gray-400 dark:placeholder:text-gray-500"
          />
        </div>
      </div>

      <!-- Chats -->
      <div class="flex-1 overflow-y-auto">
        @for (chat of chats(); track chat.id) {
          <app-chat-list-item
            [chat]="chat"
            [isSelected]="chat.id === selectedChatId()"
            (selected)="onSelectChat($event)"
          />
        } @empty {
          <p class="text-center text-gray-400 dark:text-gray-500 mt-10 text-sm">
            {{ searchQuery().trim() ? 'مفيش نتائج بحث' : 'لا توجد محادثات بعد' }}
          </p>
        }
      </div>
    }
  }
</div>
