name: CI

on:
  push:
    branches:
      - develop
      - master

  pull_request:
    branches:
      - develop
      - master

  workflow_dispatch:

jobs:

  # =========================
  # Backend CI
  # =========================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./backend/chatme/chatme.slnx

      - name: Build
        run: dotnet build ./backend/chatme/chatme.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./backend/chatme/chatme.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish ./backend/chatme/chatme.slnx --configuration Release --output ./artifacts/backend

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: ./artifacts/backend


  # =========================
  # Angular CI
  # =========================
  frontend:
    name: Angular CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular
        run: npm run build
        working-directory: ./frontend

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: ./frontend/dist/<project-name>/browser/
