@if (updateService.updateAvailable()) {

  <div class="fixed bottom-5 left-5 right-5 z-50
              bg-white dark:bg-gray-800
              shadow-xl rounded-xl p-4
              flex items-center justify-between gap-3">

    <div>
      <h3 class="font-bold">
        يتوفر تحديث جديد!
      </h3>
      <p class="text-sm text-gray-500">
        يوجد إصدار جديد من التطبيق.
      </p>
    </div>

    <button
      (click)="updateService.updateApp()"class="bg-green-600 text-white px-4 py-2 rounded-lg">
      تحديث الآن
    </button>
  </div>
}
