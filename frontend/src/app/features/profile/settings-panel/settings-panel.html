<!-- الإشعارات (Web Push) -->
<button
  (click)="onToggleNotifications()"
  [disabled]="notificationsDisabled()"
  class="w-full flex items-center justify-between gap-3 px-6 py-4 border-b border-gray-100 dark:border-wa-dark-border hover:bg-gray-50 dark:hover:bg-white/5 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
>
  <div class="flex items-center gap-4 text-start">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="text-wa-gray-icon dark:text-gray-300 shrink-0">
      <path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 0 0-3 0v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/>
    </svg>
    <div>
      <span class="text-gray-800 dark:text-gray-100">الإشعارات</span>
      <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">{{ notificationsHint() }}</p>
    </div>
  </div>
  <span
    class="w-11 h-6 rounded-full relative transition-colors shrink-0"
    [class.bg-wa-green-light]="notificationsEnabled()"
    [class.bg-gray-300]="!notificationsEnabled()"
  >
    <span
      class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all"
      [style.right.px]="notificationsEnabled() ? 1 : 23"
    ></span>
  </span>
</button>
