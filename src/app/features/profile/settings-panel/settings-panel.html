<div class="flex flex-col h-full bg-white dark:bg-wa-dark-panel">
  <!-- Header -->
  <div class="flex items-center gap-4 px-4 py-3 bg-wa-bg-panel dark:bg-wa-dark-panel border-b border-gray-200 dark:border-wa-dark-border">
    <button (click)="onBack()" class="text-wa-gray-icon dark:text-gray-300 shrink-0" aria-label="رجوع">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M9 18l6-6-6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="text-lg font-medium text-gray-800 dark:text-gray-100">الإعدادات</h1>
  </div>

  <div class="flex-1 overflow-y-auto">
    <!-- الوضع الليلي -->
    <button
      (click)="onToggleTheme()"
      class="w-full flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-wa-dark-border hover:bg-gray-50 dark:hover:bg-white/5 transition-colors"
    >
      <div class="flex items-center gap-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="text-wa-gray-icon dark:text-gray-300">
          <path d="M12.1 22c5.5 0 9.9-4.4 9.9-9.9 0-.5-.4-.8-.9-.7-1 .3-2 .4-3.1.4-6 0-10.9-4.9-10.9-10.9 0-1 .1-2.1.4-3.1.1-.5-.2-.9-.7-.9C1.4 2.9 2 7.3 2 12.1 2 17.6 6.5 22 12.1 22z"/>
        </svg>
        <span class="text-gray-800 dark:text-gray-100">الوضع الليلي</span>
      </div>
      <!-- Toggle Switch -->
      <span
        class="w-11 h-6 rounded-full relative transition-colors shrink-0"
        [class.bg-wa-green-light]="isDarkMode()"
        [class.bg-gray-300]="!isDarkMode()"
      >
        <span
          class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all"
          [style.right.px]="isDarkMode() ? 1 : 23"
        ></span>
      </span>
    </button>

    <!-- الإشعارات (Mock) -->
    <button
      (click)="onToggleNotifications()"
      class="w-full flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-wa-dark-border hover:bg-gray-50 dark:hover:bg-white/5 transition-colors"
    >
      <div class="flex items-center gap-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="text-wa-gray-icon dark:text-gray-300">
          <path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 0 0-3 0v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <span class="text-gray-800 dark:text-gray-100">الإشعارات</span>
      </div>
      <span
        class="w-11 h-6 rounded-full relative transition-colors shrink-0"
        [class.bg-wa-green-light]="notificationsEnabled()"
        [class.bg-gray-300]="!notificationsEnabled()"
      >
        <span
          class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all"
          [style.right.px]="notificationsEnabled() ? 1 : 23"
        ></span>
      </span>
    </button>

    <!-- معلومات عن التطبيق -->
    <div class="px-6 py-4 border-b border-gray-100 dark:border-wa-dark-border">
      <div class="flex items-center gap-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="text-wa-gray-icon dark:text-gray-300">
          <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
        <div>
          <p class="text-gray-800 dark:text-gray-100">تطبيق المحادثات</p>
          <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">الإصدار 1.0.0 (نسخة تجريبية)</p>
        </div>
      </div>
    </div>
  </div>
</div>
